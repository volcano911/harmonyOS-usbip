name: Release

# Pushing a tag like v1.3.2 publishes a GitHub Release and attaches the
# unsigned HAP from release/. Nothing is built here on purpose: the HAP is
# produced locally with the HarmonyOS toolchain and committed alongside its
# checksum, so the workflow only verifies and publishes it.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app.json5 version
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' AppScope/app.json5 | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "app.json5=${app_version} tag=${tag_version}"
          if [ "${app_version}" != "${tag_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match versionName ${app_version} in AppScope/app.json5"
            exit 1
          fi

      - name: Verify HAP checksum
        run: |
          set -euo pipefail
          cd release
          ls -l ./*.hap
          sha256sum -c SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            HarmonyOS USB/IP ${{ github.ref_name }}

            附件里的 HAP 是**未签名**构建，零售设备无法直接安装。
            请用 DevEco Studio 自动签名，或用自己的证书与 Provision Profile
            重新签名后再 `hdc install`。

            安装前请核对 `SHA256SUMS.txt` 中的校验值。
            包内说明见 [README](https://github.com/${{ github.repository }}/blob/main/README.md)。
          files: |
            release/*.hap
            release/SHA256SUMS.txt
